services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: keben
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: keben
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keben -d keben"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgresql://keben:${POSTGRES_PASSWORD}@db:5432/keben
      DEMO_MODE: "false"
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    command: ["node", "server.js"]
    environment:
      DATABASE_URL: postgresql://keben:${POSTGRES_PASSWORD}@db:5432/keben
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      DEMO_MODE: "false"
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:

